<div class="min-h-screen bg-sand-50">

  <header class="border-b border-sand-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-2.5">
        <span class="flex size-8 items-center justify-center rounded-lg bg-sage-600 text-sand-50">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="13" rx="2.5" />
            <path d="M3 10h18" />
            <circle cx="7.5" cy="20" r="1.5" />
            <circle cx="16.5" cy="20" r="1.5" />
          </svg>
        </span>
        <span class="font-semibold text-ink">Passage</span>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="rounded-lg px-3 py-1.5 text-sm text-stone-600 transition hover:bg-sand-100"
      >
        Sair
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-10">
    @if (user(); as current) {
      <h1 class="text-2xl font-semibold tracking-tight text-ink">
        Olá, {{ current.email }}
      </h1>
      <p class="mt-1 text-stone-600">{{ roleLabel() }}</p>

      <div class="mt-8 rounded-xl border border-sand-200 bg-white p-6">
        <p class="text-sm text-stone-600">
          Sessão autenticada. Os módulos operacionais entram aqui.
        </p>
      </div>
    }
  </main>

</div>
